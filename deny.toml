# cargo-deny: licences, bans, sources and security advisories for the Rust dependencies, with every
# feature (`gpu`, `cuda-install`). `mise run audit` runs every check; CI runs licences, bans and
# sources on every push and the advisories weekly. Language data (the Mandarin tables, the reading
# rules) is not a crate: its sources and licences are in NOTICE.

[advisories]
# Unmaintained crates count only when a kempelen crate depends on them directly.
unmaintained = "workspace"
yanked = "warn"
# Each ignored advisory needs its id and the reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "..." },
ignore = [
  # As manuzio, from which the CUDA download was copied (feature `cuda-install`).
  { id = "RUSTSEC-2026-0367", reason = "zip 7: concerns ZipArchive::extract, which kempelen never calls (the CUDA install extracts entry by entry to allowlisted names); fixed by zip 9" },
  { id = "RUSTSEC-2026-0368", reason = "zip 7: concerns ZipStreamReader::extract, not used; see RUSTSEC-2026-0367" },
  { id = "RUSTSEC-2026-0369", reason = "zip 7: extract helpers, not used; see RUSTSEC-2026-0367" },
]

[licenses]
# Permissive licences only: kempelen is Apache-2.0 and is linked into closed-source programs, so no
# copyleft, weak or strong. A dependency under any other licence fails until the owner approves it
# here. CDLA-Permissive-2.0 is webpki-roots' (the root certificates of the CUDA download, feature
# `cuda-install`), as in manuzio.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# kempelen's own crates (`publish = false`): Apache-2.0 (LICENSE).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# jespersen (the phonemes of every language but Mandarin, CC0) is the owner's own library, pinned
# to a commit.
allow-git = ["https://github.com/Federiker/jespersen"]
